version: '3.8'

services:
  # Servicio de MySQL
  auth_mysql:
    image: mysql:8.0
    container_name: auth_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: ${DB_NAME_AUTH}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sifa-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_segura" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la API Auth
  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-api
    restart: unless-stopped
    ports:
      # Publicado solo en loopback: en producción el tráfico llega por la IP
      # privada (ver deploy_SIFA-AUTH.sh), no por todas las interfaces.
      - "127.0.0.1:8081:8080"
    environment:
      # Database
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME_AUTH: ${DB_NAME_AUTH}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Admin
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # App
      SERVER_PORT: 8080

      # Security
      BCRYPT_STRENGTH: 10

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}
      INTERNAL_JWT_ISSUER: ${INTERNAL_JWT_ISSUER}
      INTERNAL_JWT_AUDIENCE: ${INTERNAL_JWT_AUDIENCE}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE}
      JWT_EXPIRATION_SECONDS: 3600
      JWT_REFRESH_EXPIRATION_SECONDS: 86400

      # Firma del canal interno: la exige ChannelKeyFilter (entrada) y la adjunta
      # CoreAuditFeignConfig cuando auth llama a core (salida).
      INTERNAL_CHANNEL_KEY: ${INTERNAL_CHANNEL_KEY:-}

      # SMTP Mail Config
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}

      # url del core para logs de auditoria
      CORE_SERVICE_URL: ${CORE_SERVICE_URL}
      # intervalo (ms) de reintento de eventos de auditoria pendientes
      AUDIT_RETRY_INTERVAL_MS: ${AUDIT_RETRY_INTERVAL_MS:-30000}
    depends_on:
      auth_mysql:
        condition: service_healthy
    networks:
      - sifa-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/v3/api-docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # ← Aumentar tiempo de inicio

volumes:
  mysql_data:
    driver: local

networks:
  sifa-network:
    external: true  # ← Indicar que es externa